<!DOCTYPE html>
<!--GitHub-VM-Remote-Desktop-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GitHub VM Remote Desktop</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:#0a0a0a;color:#eee;position:fixed;inset:0;display:flex;flex-direction:column;
       font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  header{background:#1a1a1a;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;
         border-bottom:1px solid #333;flex:none}
  header h1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .status{font-size:11px;color:#0f0;white-space:nowrap;margin-left:8px}
  #toolbar{background:#222;padding:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
           border-bottom:1px solid #333;flex:none}
  #toolbar button,#toolbar input{font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid #444;
           background:#333;color:#fff;-webkit-appearance:none;appearance:none}
  #toolbar button:active{background:#555}
  #toolbar input{background:#111;min-width:120px;flex:1 1 120px}
  #viewport{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:#000;
            touch-action:none;overscroll-behavior:none;
            -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;background:#000}
  #screen{display:block;width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-drag:none}
  #overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:flex-start;
           justify-content:center;padding-top:6px}
  #fps{font:11px monospace;background:rgba(0,0,0,.7);color:#0f0;padding:3px 6px;border-radius:4px}
  .keys{display:flex;gap:4px;flex-wrap:wrap}
  .keys button{padding:5px 8px;font-size:11px}
  .hint{font-size:10px;line-height:1.5;color:#8a8a8a;padding:5px 8px;text-align:center;background:#111;flex:none}
  .sep{width:1px;height:22px;background:#444;margin:0 2px}
  #modeBtn.on{border-color:#3ea6ff;color:#8fd0ff}
  #dataBtn.on{border-color:#39c07a;color:#8ff0bb}
</style>
</head>
<body>
  <header>
    <h1>🖥️ GitHub VM Remote</h1>
    <div class="status" id="st">Connecting…</div>
  </header>
  <div id="toolbar">
    <input id="typeText" placeholder="Type text here &amp; Send" autocomplete="off" autocapitalize="off" spellcheck="false" />
    <button onclick="sendType()">Send (Paste)</button>
    <button onclick="sendKey('enter')">Enter</button>
    <button onclick="sendKey('backspace')">⌫</button>
    <button onclick="sendKey('tab')">Tab</button>
    <button onclick="sendKey('escape')">Esc</button>
    <div class="sep"></div>
    <div class="keys">
      <button onclick="sendHotkey('ctrl+c')">Ctrl+C</button>
      <button onclick="sendHotkey('ctrl+v')">Ctrl+V</button>
      <button onclick="sendHotkey('ctrl+a')">Ctrl+A</button>
      <button onclick="sendHotkey('ctrl+z')">Ctrl+Z</button>
      <button onclick="sendHotkey('alt+f4')">Alt+F4</button>
      <button onclick="sendHotkey('win+r')">Win+R</button>
      <button onclick="sendHotkey('win+d')">Win+D</button>
    </div>
    <div class="sep"></div>
    <button onclick="sendKey('up')">↑</button>
    <button onclick="sendKey('down')">↓</button>
    <button onclick="sendKey('left')">←</button>
    <button onclick="sendKey('right')">→</button>
    <div class="sep"></div>
    <button id="zoomOut" title="Zoom out">🔍−</button>
    <button id="zoomIn" title="Zoom in">🔍+</button>
    <button id="zoomFit" title="Fit whole desktop">Fit</button>
    <button id="zoomOne" title="Actual size">1:1</button>
    <button id="modeBtn" class="on" title="What a one-finger swipe does">Swipe: Scroll</button>
    <button id="qualityBtn" title="Picture resolution">HD: Auto</button>
    <button id="dataBtn" title="Data saver: stop fetching when quiet">Data: Normal</button>
    <button onclick="location.reload()">↻</button>
  </div>
  <div id="viewport">
    <div id="stage">
      <canvas id="screen" width="960" height="540"></canvas>
    </div>
    <div id="overlay"><div id="fps">Live</div></div>
  </div>
  <div class="hint" id="hint">Swipe = scroll wheel • Pinch = zoom • Tap = click • Long-press = right-click • Double-tap = double-click</div>
<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ *
 * Remote desktop client.
 *
 * Transport: dirty-tile deltas (the way VNC / TeamViewer / RDP work).
 * The server keeps one frame; it long-polls /frames for the list of
 * rectangles that changed and fetches only those images from /tile. An
 * idle desktop therefore transfers almost nothing instead of a full
 * JPEG many times per second.
 *
 * Touch: a one-finger swipe scrolls like the mouse wheel (it never
 * presses a button, so it cannot select text), a two-finger pinch zooms
 * the local view, tap / long press / double tap click as expected.
 * ------------------------------------------------------------------ */

var viewport = document.getElementById('viewport');
var stage    = document.getElementById('stage');
var canvas   = document.getElementById('screen');
var ctx      = canvas.getContext('2d');
var fpsEl    = document.getElementById('fps');
var stEl     = document.getElementById('st');
var modeBtn  = document.getElementById('modeBtn');
var dataBtn  = document.getElementById('dataBtn');
var qualityBtn = document.getElementById('qualityBtn');

// ---- geometry -----------------------------------------------------
var screenW = 1920, screenH = 1080;     // remote desktop size
var frameW = 960, frameH = 540;         // delta picture size
var zoom = 1, panX = 0, panY = 0, fitScale = 1;

// ---- tuning -------------------------------------------------------
var TAP_MOVE_PX      = 12;
var TAP_MS           = 600;
var LONG_PRESS_MS    = 650;
var DRAG_EPS         = 4;
var SWIPE_SEND_MS    = 55;
var MIN_FIT_FACTOR   = 0.35;
var MAX_ABS_ZOOM     = 8;
var POLL_TIMEOUT     = 20;             // long-poll seconds
var POLL_RETRY_MS    = 400;
var MAX_PARALLEL     = 6;              // tile requests in flight

var swipeMode = 'scroll';              // 'scroll' | 'pan'
var qualityMode = 'auto';              // 'auto' | 'high' | 'low'
var dataSaver = false;                 // pause polling while the screen is idle
var lastSeq = 0;
var pictureReady = false;
var pending = [];                      // rectangles waiting to be drawn
var inFlight = 0, drawn = 0, bytesIn = 0;
var lastDrawAt = 0, dirtySince = 0;
var pollAbort = null;

// ---- helpers ------------------------------------------------------
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function vpRect(){ return viewport.getBoundingClientRect(); }
function vpW(){ return viewport.clientWidth  || 1; }
function vpH(){ return viewport.clientHeight || 1; }
function now(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }
function flash(msg){
  if (!fpsEl) return;
  fpsEl.textContent = msg;
  clearTimeout(flash.timer);
  flash.timer = setTimeout(function(){ fpsEl.textContent = 'Live'; }, 900);
}

// ---- view math ----------------------------------------------------
function computeFit(){
  var s = Math.min(vpW() / screenW, vpH() / screenH);
  if (!isFinite(s) || s <= 0) s = 1;
  fitScale = Math.min(s, 1);
}
function maxZoom(){ return clamp(Math.max(fitScale * 10, 2), 2, MAX_ABS_ZOOM); }
function minZoom(){ return fitScale * MIN_FIT_FACTOR; }

function clampPan(){
  var w = vpW(), h = vpH();
  var cw = screenW * zoom, ch = screenH * zoom;
  if (cw <= w + 0.5) panX = (w - cw) / 2; else panX = clamp(panX, w - cw, 0);
  if (ch <= h + 0.5) panY = (h - ch) / 2; else panY = clamp(panY, h - ch, 0);
}
function applyView(){
  stage.style.transform = 'translate3d(' + panX + 'px,' + panY + 'px,0) scale(' + zoom + ')';
}
function fitView(){
  computeFit();
  zoom = fitScale;
  clampPan();
  applyView();
}
function zoomTo(newZoom, clientX, clientY){
  newZoom = clamp(newZoom, minZoom(), maxZoom());
  if (!isFinite(newZoom) || newZoom <= 0) return;
  var r = vpRect();
  var ax = clientX - r.left, ay = clientY - r.top;
  var dx = (ax - panX) / zoom;
  var dy = (ay - panY) / zoom;
  zoom = newZoom;
  panX = ax - dx * zoom;
  panY = ay - dy * zoom;
  clampPan();
  applyView();
  maybeUpgradeQuality();
}
function zoomByStep(factor){
  var r = vpRect();
  zoomTo(zoom * factor, r.left + r.width / 2, r.top + r.height / 2);
  flash('Zoom ' + Math.round(zoom / fitScale * 100) + '%');
}

// ---- input --------------------------------------------------------
function postInput(data){
  return fetch('/input', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data),
    keepalive: true
  }).catch(function(){ return null; });
}
function ratioAt(clientX, clientY){
  var r = stage.getBoundingClientRect();
  if (!r.width || !r.height) return {x: 0.5, y: 0.5};
  return {
    x: clamp((clientX - r.left) / r.width, 0, 1),
    y: clamp((clientY - r.top) / r.height, 0, 1)
  };
}

/* ---- scroll pipeline --------------------------------------------- *
 * Swipe pixels are accumulated and pushed to the VM as mouse wheel
 * notches (the server keeps the sub-notch remainder), so a swipe feels
 * like rolling the wheel instead of dragging the mouse. The pointer is
 * sent along so the wheel lands on the window under the finger.        */
var scrollQueue = {dx: 0, dy: 0, x: 0.5, y: 0.5, needReset: false, resetSent: true,
                   timer: 0, busy: false, watchdog: 0};

function queueScroll(dxPixels, dyPixels, ratio){
  scrollQueue.dx += dxPixels;
  scrollQueue.dy += dyPixels;
  if (ratio){ scrollQueue.x = ratio.x; scrollQueue.y = ratio.y; }
  scheduleScroll();
}
function scheduleScroll(){
  if (scrollQueue.timer || scrollQueue.busy) return;
  scrollQueue.timer = setTimeout(flushScroll, SWIPE_SEND_MS);
}
function flushScroll(){
  if (scrollQueue.timer){ clearTimeout(scrollQueue.timer); scrollQueue.timer = 0; }
  if (scrollQueue.busy) return;
  var dx = scrollQueue.dx, dy = scrollQueue.dy, reset = scrollQueue.needReset;
  if (!dx && !dy && !reset) return;
  scrollQueue.dx = 0; scrollQueue.dy = 0; scrollQueue.needReset = false;
  if (reset) scrollQueue.resetSent = true;
  scrollQueue.busy = true;
  clearTimeout(scrollQueue.watchdog);
  scrollQueue.watchdog = setTimeout(function(){ scrollQueue.busy = false; }, 1500);
  postInput({action: 'scroll', pixels: true, dx: dx, dy: dy, reset: reset,
             x_ratio: scrollQueue.x, y_ratio: scrollQueue.y})
    .then(function(){
      clearTimeout(scrollQueue.watchdog);
      scrollQueue.busy = false;
      if (scrollQueue.dx || scrollQueue.dy || scrollQueue.needReset) scheduleScroll();
    }, function(){
      clearTimeout(scrollQueue.watchdog);
      scrollQueue.busy = false;
    });
}

// ---- touch / pen gestures ----------------------------------------
var pointers = new Map();
var single = null, pinch = null;
var lastTouchAt = 0, mousePan = null, mouseDown = null;
var lastMouseClick = {t: 0, x: 0, y: 0};

function pointList(){ return Array.from(pointers.values()); }
function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

function clearLongPress(){
  if (single && single.longPress){ clearTimeout(single.longPress); single.longPress = 0; }
}
function startSingle(e){
  single = {startX: e.clientX, startY: e.clientY,
            lastX: e.clientX, lastY: e.clientY,
            startedAt: now(), mode: null, longPress: 0};
  single.longPress = setTimeout(function(){
    if (!single || single.mode) return;
    single.mode = 'longpress';
    var r = ratioAt(single.startX, single.startY);
    postInput({action: 'rclick', x_ratio: r.x, y_ratio: r.y});
    flash('Right click');
  }, LONG_PRESS_MS);
}
function startPinch(){
  var pts = pointList();
  if (pts.length < 2){ pinch = null; return; }
  pinch = {dist: Math.max(1, dist(pts[0], pts[1])),
           midX: (pts[0].x + pts[1].x) / 2,
           midY: (pts[0].y + pts[1].y) / 2};
}
function handlePinch(){
  var pts = pointList();
  if (pts.length < 2){ pinch = null; return; }
  if (!pinch) startPinch();
  if (!pinch) return;
  var d = Math.max(1, dist(pts[0], pts[1]));
  var mx = (pts[0].x + pts[1].x) / 2;
  var my = (pts[0].y + pts[1].y) / 2;
  if (pinch.midX || pinch.midY){ panX += mx - pinch.midX; panY += my - pinch.midY; }
  pinch.midX = mx; pinch.midY = my;
  var ratio = d / pinch.dist;
  pinch.dist = d;
  if (Math.abs(ratio - 1) > 0.002){
    zoomTo(zoom * ratio, mx, my);
  } else {
    clampPan();
    applyView();
  }
}
function onPointerDown(e){
  if (e.pointerType === 'mouse') return;
  e.preventDefault();
  lastTouchAt = Date.now();
  try { viewport.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pointers.size === 1){
    pinch = null;
    startSingle(e);
  } else if (pointers.size === 2){
    clearLongPress();
    if (single) single.mode = single.mode || 'twofinger';
    single = null;
    startPinch();
  }
}
function onPointerMove(e){
  if (e.pointerType === 'mouse') return;
  var p = pointers.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size >= 2){ handlePinch(); return; }
  if (!single) return;
  if (!single.mode){
    var moved = Math.hypot(e.clientX - single.startX, e.clientY - single.startY);
    if (moved < TAP_MOVE_PX) return;
    clearLongPress();
    single.mode = (swipeMode === 'pan') ? 'pan' : 'scroll';
    single.lastX = e.clientX; single.lastY = e.clientY;
    if (single.mode === 'scroll' && !scrollQueue.resetSent) scrollQueue.needReset = true;
    return;
  }
  var stepX = e.clientX - single.lastX;
  var stepY = e.clientY - single.lastY;
  if (!stepX && !stepY) return;
  single.lastX = e.clientX; single.lastY = e.clientY;
  if (single.mode === 'scroll'){
    queueScroll(stepX / zoom, stepY / zoom, ratioAt(e.clientX, e.clientY));
  } else if (single.mode === 'pan'){
    panX += stepX; panY += stepY;
    clampPan();
    applyView();
  }
}
function endPointer(e, cancelled){
  if (e.pointerType === 'mouse') return;
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  lastTouchAt = Date.now();
  if (pointers.size >= 2){ handlePinch(); return; }
  if (pointers.size === 1){
    pinch = null;
    var only = pointList()[0];
    single = {startX: only.x, startY: only.y, lastX: only.x, lastY: only.y,
              startedAt: now(), mode: 'pan', longPress: 0};
    return;
  }
  pinch = null;
  if (single){
    clearLongPress();
    var elapsed = now() - single.startedAt;
    var travelled = Math.hypot(e.clientX - single.startX, e.clientY - single.startY);
    if (!single.mode && !cancelled && elapsed <= TAP_MS && travelled <= TAP_MOVE_PX){
      var r = ratioAt(single.startX, single.startY);
      postInput({action: 'click', x_ratio: r.x, y_ratio: r.y});
      flash('Click');
    } else if (single.mode === 'scroll'){
      flushScroll();
    }
    single = null;
  }
  if (scrollQueue.dx || scrollQueue.dy) flushScroll();
  scrollQueue.needReset = true;
  scrollQueue.resetSent = false;
}
viewport.addEventListener('pointerdown', onPointerDown, {passive: false});
viewport.addEventListener('pointermove', onPointerMove, {passive: false});
viewport.addEventListener('pointerup', function(e){ endPointer(e, false); }, {passive: false});
viewport.addEventListener('pointercancel', function(e){ endPointer(e, true); }, {passive: false});
['touchstart', 'touchmove', 'gesturestart', 'gesturechange'].forEach(function(name){
  viewport.addEventListener(name, function(e){ if (e.cancelable) e.preventDefault(); },
                            {passive: false});
});

// ---- mouse --------------------------------------------------------
viewport.addEventListener('mousedown', function(e){
  if (Date.now() - lastTouchAt < 800) return;
  if (e.button === 1 || (e.button === 0 && e.altKey)){
    e.preventDefault();
    mousePan = {x: e.clientX, y: e.clientY};
    return;
  }
  if (e.button !== 0) return;
  mouseDown = {x: e.clientX, y: e.clientY, moved: false};
});
window.addEventListener('mousemove', function(e){
  if (mousePan){
    panX += e.clientX - mousePan.x;
    panY += e.clientY - mousePan.y;
    mousePan = {x: e.clientX, y: e.clientY};
    clampPan();
    applyView();
    return;
  }
  if (mouseDown && (Math.abs(e.clientX - mouseDown.x) > DRAG_EPS ||
                    Math.abs(e.clientY - mouseDown.y) > DRAG_EPS)){
    mouseDown.moved = true;
  }
});
window.addEventListener('mouseup', function(e){
  if (mousePan){
    if (e.button === 1 || e.button === 0) mousePan = null;
    return;
  }
  if (e.button !== 0 || !mouseDown) return;
  var down = mouseDown;
  mouseDown = null;
  if (Date.now() - lastTouchAt < 800) return;
  if (down.moved){
    var a = ratioAt(down.x, down.y), b = ratioAt(e.clientX, e.clientY);
    postInput({action: 'drag', x_ratio: a.x, y_ratio: a.y, x2_ratio: b.x, y2_ratio: b.y});
    flash('Drag');
    return;
  }
  // A double click is two real clicks; the VM composes the double/triple
  // click itself, so a separate "dblclick" on top would click three times.
  var t = now();
  var r = ratioAt(down.x, down.y);
  var quick = t - lastMouseClick.t < 380 &&
              Math.abs(down.x - lastMouseClick.x) < 12 &&
              Math.abs(down.y - lastMouseClick.y) < 12;
  postInput({action: 'click', x_ratio: r.x, y_ratio: r.y});
  lastMouseClick = quick ? {t: 0, x: 0, y: 0} : {t: t, x: down.x, y: down.y};
  flash(quick ? 'Double click' : 'Click');
});
viewport.addEventListener('contextmenu', function(e){
  e.preventDefault();
  if (Date.now() - lastTouchAt < 800) return;
  var r = ratioAt(e.clientX, e.clientY);
  postInput({action: 'rclick', x_ratio: r.x, y_ratio: r.y});
  flash('Right click');
});
viewport.addEventListener('wheel', function(e){
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){
    zoomTo(zoom * Math.exp(-e.deltaY * 0.0025), e.clientX, e.clientY);
    return;
  }
  var unit = e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? vpH() : 1);
  queueScroll(-e.deltaX * unit / zoom, -e.deltaY * unit / zoom,
              ratioAt(e.clientX, e.clientY));
  flushScroll();
}, {passive: false});

// ---- keyboard -----------------------------------------------------
document.addEventListener('keydown', function(e){
  if (document.activeElement && document.activeElement.id === 'typeText') return;
  if (e.repeat) return;
  var key = (e.key || '').toLowerCase();
  if (key === 'enter' || key === 'tab' || key === 'escape' || key === 'backspace' ||
      key === 'delete' || key === 'arrowup' || key === 'arrowdown' ||
      key === 'arrowleft' || key === 'arrowright'){
    e.preventDefault();
    var map = {'arrowup': 'up', 'arrowdown': 'down', 'arrowleft': 'left', 'arrowright': 'right'};
    postInput({action: 'key', keys: map[key] || key});
  } else if (e.ctrlKey || e.altKey || e.metaKey){
    var combo = [];
    if (e.ctrlKey) combo.push('ctrl');
    if (e.altKey) combo.push('alt');
    if (e.metaKey) combo.push('win');
    if (key.length === 1) combo.push(key);
    else if (['control', 'alt', 'meta', 'shift'].indexOf(key) === -1) combo.push(key);
    if (combo.length > 1){
      e.preventDefault();
      postInput({action: 'hotkey', keys: combo.join('+')});
    }
  } else if (key.length === 1){
    postInput({action: 'type', text: e.key});
  }
});

// ---- toolbar ------------------------------------------------------
function sendType(){
  var el = document.getElementById('typeText');
  var t = el.value;
  if (!t) return;
  postInput({action: 'type', text: t});
  el.value = '';
  flash('Typed ' + t.length + ' chars');
}
window.sendType = sendType;
window.sendKey = function(k){ postInput({action: 'key', keys: k}); };
window.sendHotkey = function(k){ postInput({action: 'hotkey', keys: k}); };
document.getElementById('typeText').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); sendType(); }
});
document.getElementById('zoomIn').addEventListener('click', function(){ zoomByStep(1.25); });
document.getElementById('zoomOut').addEventListener('click', function(){ zoomByStep(1 / 1.25); });
document.getElementById('zoomFit').addEventListener('click', function(){ fitView(); flash('Fit'); });
document.getElementById('zoomOne').addEventListener('click', function(){
  var r = vpRect();
  zoomTo(1, r.left + r.width / 2, r.top + r.height / 2);
  flash('1:1');
});
modeBtn.addEventListener('click', function(){
  swipeMode = (swipeMode === 'scroll') ? 'pan' : 'scroll';
  modeBtn.textContent = 'Swipe: ' + (swipeMode === 'scroll' ? 'Scroll' : 'Pan');
  modeBtn.className = (swipeMode === 'scroll') ? 'on' : '';
  flash('Swipe = ' + swipeMode);
});

// ---- picture resolution ------------------------------------------
var streamWidth = 0;
function desiredWidth(){
  if (qualityMode === 'high') return 1600;
  if (qualityMode === 'low')  return 854;
  var need = screenW * zoom * (window.devicePixelRatio || 1);
  return Math.round(clamp(need, 480, 1600));
}
function restartStream(){
  var target = desiredWidth();
  if (target === streamWidth) return;
  streamWidth = target;
  fetch('/quality?w=' + target).catch(function(){});
  lastSeq = 0;                        // ask for a fresh full picture
}
qualityBtn.addEventListener('click', function(){
  qualityMode = (qualityMode === 'auto') ? 'high' : (qualityMode === 'high' ? 'low' : 'auto');
  qualityBtn.textContent = 'HD: ' + (qualityMode === 'auto' ? 'Auto'
                        : (qualityMode === 'high' ? 'High' : 'Low'));
  restartStream();
  flash('Picture ' + qualityMode);
});
var lastQualityCheck = 0;
function maybeUpgradeQuality(){
  var t = now();
  if (t - lastQualityCheck < 4000 || qualityMode !== 'auto') return;
  lastQualityCheck = t;
  restartStream();
}

// ---- data saver --------------------------------------------------
function updateDataLabel(){
  dataBtn.textContent = 'Data: ' + (dataSaver ? 'Saver' : 'Normal');
  dataBtn.className = dataSaver ? 'on' : '';
}
dataBtn.addEventListener('click', function(){
  dataSaver = !dataSaver;
  updateDataLabel();
  flash(dataSaver ? 'Data saver on: quiet screens stop traffic'
                  : 'Data saver off');
  if (!dataSaver) pollLoop();
});
updateDataLabel();

// ---- delta picture ------------------------------------------------
var haveSize = false;
function applySize(w, h){
  if (!(w > 0 && h > 0)) return;
  if (haveSize && w === frameW && h === frameH) return;
  frameW = w; frameH = h;
  canvas.width = w;
  canvas.height = h;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  haveSize = true;
  pictureReady = false;
}
// Decode a tile. createImageBitmap is fastest; older Safari only has Image.
function decodeBlob(blob){
  if (typeof createImageBitmap === 'function'){
    return createImageBitmap(blob).then(function(bitmap){
      return {img: bitmap, close: function(){ if (bitmap.close) bitmap.close(); }};
    });
  }
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(blob);
    var image = new Image();
    image.onload = function(){
      resolve({img: image, close: function(){ URL.revokeObjectURL(url); }});
    };
    image.onerror = function(){
      URL.revokeObjectURL(url);
      reject(new Error('decode failed'));
    };
    image.src = url;
  });
}

function loadRect(rect, seq){
  var url = '/tile?s=' + seq + '&i=' + rect.i;
  return fetch(url, {cache: 'force-cache'})
    .then(function(res){
      if (!res.ok) throw new Error('tile ' + res.status);
      return res.blob();
    })
    .then(function(blob){
      bytesIn += blob.size || 0;
      return decodeBlob(blob);
    })
    .then(function(decoded){
      ctx.drawImage(decoded.img, rect.x, rect.y, rect.w, rect.h);
      decoded.close();
      drawn++;
      lastDrawAt = now();
      if (!pictureReady){ pictureReady = true; stEl.textContent = screenW + 'x' + screenH + ' | Live'; }
      updateStats();
    });
}
function requestTile(rect, seq){
  if (inFlight >= MAX_PARALLEL){ pending.push({rect: rect, seq: seq}); return; }
  inFlight++;
  loadRect(rect, seq).catch(function(err){
    // An expired rectangle means the client fell behind: resync.
    if (String(err && err.message).indexOf('410') >= 0) lastSeq = 0;
  }).then(function(){
    inFlight--;
    var next = pending.shift();
    if (next) requestTile(next.rect, next.seq);
  });
}
function updateStats(){
  if (flash.timer) return;
  fpsEl.textContent = drawn + ' tiles | ' + Math.round(bytesIn / 1024) + ' KB' +
                      (dataSaver ? ' | saver' : '');
}
setInterval(updateStats, 1000);

function handlePayload(payload){
  if (!payload) return;
  if (payload.w && payload.h) applySize(payload.w, payload.h);
  if (payload.full){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pictureReady = false;
  }
  if (payload.r && payload.r.length){
    dirtySince = now();
    for (var i = 0; i < payload.r.length; i++){
      requestTile(payload.r[i], payload.r[i].s || payload.seq);
    }
  }
  if (typeof payload.seq === 'number') lastSeq = payload.seq;
}

function pollLoop(){
  if (pollAbort) return;
  var controller = ('AbortController' in window) ? new AbortController() : null;
  pollAbort = controller || true;
  var quiet = dataSaver && pictureReady && (now() - dirtySince) > 4000;
  var wait = quiet ? 1 : POLL_TIMEOUT;      // idle: one cheap check per second
  var timer = setTimeout(function(){
    if (controller) controller.abort();
  }, (wait + 15) * 1000);

  fetch('/frames?seq=' + lastSeq + '&wait=' + wait,
        {cache: 'no-store', signal: controller ? controller.signal : undefined})
    .then(function(res){ return res.json(); })
    .then(function(payload){
      clearTimeout(timer);
      pollAbort = null;
      handlePayload(payload);
      // An "empty" answer means the server already waited; still keep a
      // small gap so a fast/erroneous response cannot spin the loop.
      var gap = payload && payload.reason === 'empty' ? 120 : 0;
      setTimeout(pollLoop, quiet ? 1000 : gap);
    })
    .catch(function(){
      clearTimeout(timer);
      pollAbort = null;
      if (stEl) stEl.textContent = 'Reconnecting…';
      setTimeout(pollLoop, quiet ? 1500 : POLL_RETRY_MS);
    });
}

window.addEventListener('resize', function(){
  computeFit();
  if (zoom <= fitScale * 1.02) fitView();
  else { clampPan(); applyView(); }
});
window.addEventListener('orientationchange', function(){
  setTimeout(function(){ computeFit(); fitView(); }, 250);
});

// ---- boot ---------------------------------------------------------
fetch('/info').then(function(r){ return r.json(); }).then(function(j){
  screenW = j.width || screenW;
  screenH = j.height || screenH;
  stEl.textContent = screenW + 'x' + screenH + ' | Connecting…';
}).catch(function(){}).then(function(){
  streamWidth = desiredWidth();
  fetch('/quality?w=' + streamWidth).catch(function(){});
  fitView();
  pollLoop();
});

fitView();
})();
</script>
</body>
</html>
